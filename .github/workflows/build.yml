name: Compilar Brújula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El repositorio no incluye gradle-wrapper.jar (es un binario): se instala Gradle aquí.
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # El workflow FALLA si alguna prueba falla.
      - name: Ejecutar pruebas
        run: gradle --no-daemon --stacktrace test

      # La firma es OBLIGATORIA: así todos los APK llevan siempre la misma firma y se pueden
      # instalar unos sobre otros. Sin los secretos, el workflow falla a propósito.
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          faltan=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then faltan="$faltan $v"; fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos de firma:$faltan. Ejecuta tools/crear-firma.sh (ver docs/CONFIGURACION.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/brujula.jks"

      - name: Compilar APK release firmado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/brujula.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Brujula-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar informes de pruebas (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Borrar keystore temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/brujula.jks"
